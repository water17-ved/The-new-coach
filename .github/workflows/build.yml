name: Build JEE Coach APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract JEE Coach ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Finding JEE Coach ZIP"
          echo "========================================"

          ZIP="$(find . -maxdepth 1 -type f \
            -name 'JEE-Coach-Native-Android-*.zip' \
            -printf '%f\n' | sort -V | tail -n 1)"

          if [[ -z "$ZIP" ]]; then
            echo "::error::No JEE-Coach-Native-Android-*.zip found in repository root."
            exit 1
          fi

          echo "Using ZIP: $ZIP"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP" -d extracted

          echo ""
          echo "========================================"
          echo "Locating Android Gradle project"
          echo "========================================"

          PROJECT_DIR="$(find extracted \
            -type f \
            -name 'settings.gradle.kts' \
            -print -quit | xargs -r dirname)"

          if [[ -z "$PROJECT_DIR" ]]; then
            echo "::error::settings.gradle.kts not found inside ZIP."
            find extracted -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "Project directory: $PROJECT_DIR"

          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/java/com/jeecoach/app/MainActivity.kt"

          echo ""
          echo "========================================"
          echo "Project structure OK"
          echo "========================================"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Prepare Gradle wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "./gradlew" ]]; then
            echo "::error::gradlew is missing from the extracted project."
            exit 1
          fi

          chmod +x ./gradlew

          echo "Gradle wrapper:"
          ./gradlew --version

      - name: Validate Android build configuration
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "===== Root build.gradle.kts ====="
          cat build.gradle.kts

          echo ""
          echo "===== App build.gradle.kts ====="
          cat app/build.gradle.kts

          echo ""
          echo "===== Gradle wrapper ====="
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "BUILDING DEBUG APK"
          echo "========================================"

          ./gradlew :app:assembleDebug \
            --stacktrace \
            --no-daemon \
            --warning-mode all

      - name: Find generated APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "SEARCHING FOR APK"
          echo "========================================"

          find app/build/outputs -type f -name '*.apk' -print

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -f "$APK" ]]; then
            echo "::error::APK was not generated."
            echo ""
            echo "Build output:"
            find app/build/outputs -type f -print || true
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "APK BUILD SUCCESSFUL"
          echo "========================================"

          ls -lh "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: JEE-Coach-debug-run${{ github.run_number }}
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
          compression-level: 0
