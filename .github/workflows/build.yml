name: Build JEE Coach APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and extract latest JEE Coach ZIP
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(git log --diff-filter=A --name-only --format="" -- "JEE-Coach-Native-Android-*.zip" | head -n1 || true)
          if [[ -z "$ZIP" ]]; then
            echo "::error file=build.yml::No JEE-Coach-Native-Android-*.zip found in git history."
            exit 1
          fi
          echo "Using: $ZIP"
          rm -rf extracted
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted
          for f in settings.gradle.kts app/build.gradle.kts; do
            if [[ ! -f "extracted/$f" ]]; then
              echo "::error::ZIP is missing required file: $f"
              exit 1
            fi
          done
          echo "✅ Extraction complete."

      - name: Build debug APK
        working-directory: extracted
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          gradle assembleDebug \
            --stacktrace \
            --no-daemon \
            --warning-mode all \
            --build-cache

      - name: Verify APK exists and print size
        shell: bash
        run: |
          APK=extracted/app/build/outputs/apk/debug/app-debug.apk
          if [[ ! -f "$APK" ]]; then
            echo "::error::APK not produced at expected path: $APK"
            exit 1
          fi
          SIZE=$(du -sh "$APK" | cut -f1)
          echo "✅ APK built successfully — size: $SIZE"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: JEE-Coach-debug-run${{ github.run_number }}
          path: extracted/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
          compression-level: 0
