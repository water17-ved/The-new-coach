name: Build JEE Coach APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 1. Find and extract the JEE Coach ZIP
      # ---------------------------------------------------------
      - name: Extract JEE Coach project
        shell: bash
        run: |
          set -e

          ZIP="JEE-Coach-Native-Android-v3-Persistent-Memory-Chat.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP was not found."
            echo "ZIP files present in repository:"
            find . -maxdepth 2 -type f -name "*.zip" -print
            exit 1
          fi

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | sort

          if [ ! -f "extracted/settings.gradle.kts" ]; then
            echo "ERROR: Android project was not extracted at expected root."
            exit 1
          fi

          if [ ! -f "extracted/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle.kts not found."
            exit 1
          fi

      # ---------------------------------------------------------
      # 2. Java 17
      # ---------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ---------------------------------------------------------
      # 3. Fix Android/Kotlin build configuration
      # ---------------------------------------------------------
      - name: Configure Android build
        shell: bash
        run: |
          set -e

          cd extracted

          python3 <<'PY'
          from pathlib import Path

          # ---------------------------------------------------
          # Root build.gradle.kts
          # ---------------------------------------------------
          root = Path("build.gradle.kts")

          root.write_text("""plugins {
              id("com.android.application") version "8.13.2" apply false
              id("org.jetbrains.kotlin.android") version "2.3.20" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.3.20" apply false
          }
          """, encoding="utf-8")

          # ---------------------------------------------------
          # app/build.gradle.kts
          # ---------------------------------------------------
          app = Path("app/build.gradle.kts")

          text = app.read_text(encoding="utf-8")

          # Replace the complete android block.
          start = text.index("android {")

          depth = 0
          end = None

          for i in range(start, len(text)):
              if text[i] == "{":
                  depth += 1
              elif text[i] == "}":
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break

          if end is None:
              raise RuntimeError("Could not locate android block.")

          android_block = """android {
              namespace = "com.jeecoach.app"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.jeecoach.app"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          kotlin {
              jvmToolchain(17)
          }"""

          text = text[:start] + android_block + text[end:]

          app.write_text(text, encoding="utf-8")

          print("----- build.gradle.kts -----")
          print(root.read_text(encoding="utf-8"))

          print("----- app/build.gradle.kts -----")
          print(app.read_text(encoding="utf-8"))
          PY

      # ---------------------------------------------------------
      # 4. Download Gradle 8.13 directly
      #
      # Do NOT use the runner's preinstalled `gradle` command.
      # ---------------------------------------------------------
      - name: Install Gradle 8.13
        shell: bash
        run: |
          set -e

          GRADLE_VERSION="8.13"
          GRADLE_DIR="$HOME/gradle-$GRADLE_VERSION"

          if [ ! -d "$GRADLE_DIR" ]; then
            wget -q \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
              -O /tmp/gradle.zip

            unzip -q /tmp/gradle.zip -d "$HOME"

            rm -f /tmp/gradle.zip
          fi

          "$GRADLE_DIR/bin/gradle" --version

      # ---------------------------------------------------------
      # 5. Generate wrapper USING Gradle 8.13
      # ---------------------------------------------------------
      - name: Generate Gradle wrapper
        shell: bash
        run: |
          set -e

          cd extracted

          "$HOME/gradle-8.13/bin/gradle" wrapper --gradle-version 8.13

          chmod +x gradlew

          ./gradlew --version

      # ---------------------------------------------------------
      # 6. Build debug APK
      # ---------------------------------------------------------
      - name: Build debug APK
        shell: bash
        run: |
          set -e

          cd extracted

          ./gradlew clean assembleDebug --stacktrace

      # ---------------------------------------------------------
      # 7. Verify APK exists
      # ---------------------------------------------------------
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="extracted/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            find extracted/app/build -type f | sort || true
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      # ---------------------------------------------------------
      # 8. Upload APK
      # ---------------------------------------------------------
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: JEE-Coach-debug
          path: extracted/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
