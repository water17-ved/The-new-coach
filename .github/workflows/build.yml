# ─────────────────────────────────────────────────────────────────────────────
# JEE Coach — GitHub Actions build
#
# Stack audit (from repo files):
#   JDK                 : 17 (Temurin)
#   Gradle              : 8.9  (gradle-wrapper.properties + custom gradlew)
#   Android Gradle Plugin: 8.7.3
#   Kotlin              : 2.0.21
#   Compose BOM         : 2024.12.01
#   compileSdk / targetSdk : 35
#   minSdk              : 26
#
# ZIP-commit workflow: developer commits JEE-Coach-Native-Android-*.zip to
# repo root; this workflow extracts the newest one and builds it.
#
# NOTE on gradlew: the bundled gradlew is a custom self-downloading wrapper
# that puts Gradle inside ./extracted/.gradle-local/ — NOT in GRADLE_USER_HOME.
# Using the system `gradle` binary installed by setup-gradle is therefore
# cleaner in CI and avoids an extra network download inside the script.
# ─────────────────────────────────────────────────────────────────────────────

name: Build JEE Coach APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_KEY || '' }}

      - name: Find and extract latest JEE Coach ZIP
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(ls -t JEE-Coach-Native-Android-*.zip 2>/dev/null | head -n1 || true)
          if [[ -z "$ZIP" ]]; then
            echo "::error file=build.yml::No JEE-Coach-Native-Android-*.zip found in repo root."
            exit 1
          fi
          echo "Using: $ZIP"
          echo "zip_name=${ZIP%.zip}" >> "$GITHUB_OUTPUT"
          rm -rf extracted
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted
          for f in settings.gradle.kts app/build.gradle.kts; do
            if [[ ! -f "extracted/$f" ]]; then
              echo "::error::ZIP is missing required file: $f"
              exit 1
            fi
          done
          echo "✅ Extraction complete."

      - name: Fix JVM target mismatch via Gradle init script
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/jvm-target-fix.gradle << 'EOF'
          allprojects {
              tasks.withType(JavaCompile).configureEach {
                  sourceCompatibility = "17"
                  targetCompatibility = "17"
              }
              tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                  kotlinOptions.jvmTarget = "17"
              }
          }
          EOF

      - name: Build debug APK
        working-directory: extracted
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          gradle assembleDebug \
            --stacktrace \
            --no-daemon \
            --warning-mode all \
            --build-cache

      - name: Verify APK exists and print size
        shell: bash
        run: |
          APK=extracted/app/build/outputs/apk/debug/app-debug.apk
          if [[ ! -f "$APK" ]]; then
            echo "::error::APK not produced at expected path: $APK"
            exit 1
          fi
          SIZE=$(du -sh "$APK" | cut -f1)
          echo "✅ APK built successfully — size: $SIZE"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: JEE-Coach-debug-run${{ github.run_number }}
          path: extracted/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
          compression-level: 0
