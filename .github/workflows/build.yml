name: Build JEE Coach APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract latest JEE Coach ZIP
        run: |
          rm -rf extracted
          ZIP="$(find . -maxdepth 1 -type f -name 'JEE-Coach-Native-Android-v3-Repaired.zip' -print -quit)"
          test -n "$ZIP"
          unzip -q "$ZIP" -d extracted
          test -f extracted/settings.gradle.kts
          test -f extracted/app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: extracted
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JEE-Coach-debug
          path: extracted/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
