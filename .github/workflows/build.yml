name: Build JEE Coach APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q JEE-Coach-Native-Android-v3-Persistent-Memory-Chat.zip -d extracted

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip -d "$HOME"
          echo "$HOME/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Generate wrapper
        working-directory: extracted
        run: gradle wrapper --gradle-version 8.9

      - name: Build APK
        working-directory: extracted
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JEE-Coach-debug
          path: extracted/app/build/outputs/apk/debug/app-debug.apk
