name: Build JEE Coach APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Locate and extract JEE Coach ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "ZIP files in repository root:"
          find . -maxdepth 1 -type f -name 'JEE-Coach-Native-Android-*.zip' -print

          ZIP="$(find . -maxdepth 1 -type f -name 'JEE-Coach-Native-Android-*.zip' -printf '%f\n' | sort -V | tail -n 1)"

          if [ -z "$ZIP" ]; then
            echo "::error::No JEE-Coach-Native-Android-*.zip found in repository root."
            exit 1
          fi

          echo "Using ZIP: $ZIP"

          rm -rf extracted
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

          # Locate the actual Gradle project even if the ZIP contains a wrapper folder.
          PROJECT_DIR="$(find extracted -type f -name 'settings.gradle.kts' -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::The ZIP does not contain a valid Android Gradle project."
            echo "Extracted files:"
            find extracted -maxdepth 4 -type f | sort | head -200
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project root: $PROJECT_DIR"

          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/java/com/jeecoach/app/MainActivity.kt"

          echo "Android project structure validated."

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Show build tool versions
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon --warning-mode all

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::Debug APK was not generated."
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: JEE-Coach-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
