lname: Build JEE Coach APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1. CHECKOUT
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ---------------------------------------------------------
      # 2. FIND THE EXACT JEE COACH ZIP
      # ---------------------------------------------------------
      - name: Find JEE Coach ZIP
        id: zip
        shell: bash
        run: |
          ZIP="./JEE-Coach-Native-Android-v3-Persistent-Memory-Chat.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: JEE Coach ZIP not found:"
            echo "$ZIP"
            echo ""
            echo "Files in repository:"
            find . -maxdepth 2 -type f | sort
            exit 1
          fi

          echo "Found:"
          echo "$ZIP"

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"


      # ---------------------------------------------------------
      # 3. VERIFY ZIP
      # ---------------------------------------------------------
      - name: Verify ZIP integrity
        run: |
          echo "Testing ZIP..."
          unzip -t "${{ steps.zip.outputs.zip }}"

          echo "ZIP integrity check passed."


      # ---------------------------------------------------------
      # 4. EXTRACT
      # ---------------------------------------------------------
      - name: Extract JEE Coach project
        shell: bash
        run: |
          rm -rf extracted
          mkdir -p extracted

          unzip -q "${{ steps.zip.outputs.zip }}" -d extracted

          echo "Extraction completed."

          echo ""
          echo "Extracted project:"
          find extracted -maxdepth 3 -type f | sort


      # ---------------------------------------------------------
      # 5. LOCATE PROJECT
      # ---------------------------------------------------------
      - name: Locate Android project
        id: project
        shell: bash
        run: |
          SETTINGS=$(find extracted -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle(.kts) not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"


      # ---------------------------------------------------------
      # 6. VERIFY EXPECTED JEE COACH STRUCTURE
      # ---------------------------------------------------------
      - name: Validate JEE Coach project
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          echo "Checking project structure..."

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/jeecoach/app/MainActivity.kt

          echo "Project structure OK."


      # ---------------------------------------------------------
      # 7. JAVA 17
      # ---------------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ---------------------------------------------------------
      # 8. GRADLE
      # ---------------------------------------------------------
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4


      # ---------------------------------------------------------
      # 9. UPDATE PROJECT TO COMPATIBLE STABLE TOOLCHAIN
      #
      # AGP     8.13.2
      # Kotlin  2.3.20
      # Gradle  8.13
      # Java    17
      # ---------------------------------------------------------
      - name: Update Android build tool versions
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          root = Path("build.gradle.kts")
          app = Path("app/build.gradle.kts")

          # ---------------------------------------------------
          # ROOT BUILD FILE
          # ---------------------------------------------------
          text = root.read_text()

          text = text.replace(
              'id("com.android.application") version "8.7.3" apply false',
              'id("com.android.application") version "8.13.2" apply false'
          )

          text = text.replace(
              'id("org.jetbrains.kotlin.android") version "2.0.21" apply false',
              'id("org.jetbrains.kotlin.android") version "2.3.20" apply false'
          )

          text = text.replace(
              'id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false',
              'id("org.jetbrains.kotlin.plugin.compose") version "2.3.20" apply false'
          )

          root.write_text(text)

          # ---------------------------------------------------
          # APP BUILD FILE
          # ---------------------------------------------------
          text = app.read_text()

          # Make Java and Kotlin use the same JVM target.
          if "compileOptions {" not in text:
              text = text.replace(
                  '    targetSdk = 35\n',
                  '''    targetSdk = 35

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          '''
              )
          else:
              text = text.replace(
                  'sourceCompatibility = JavaVersion.VERSION_1_8',
                  'sourceCompatibility = JavaVersion.VERSION_17'
              )
              text = text.replace(
                  'targetCompatibility = JavaVersion.VERSION_1_8',
                  'targetCompatibility = JavaVersion.VERSION_17'
              )

          # Explicit Kotlin JVM toolchain.
          if "jvmToolchain(17)" not in text:
              text += '''

          kotlin {
              jvmToolchain(17)
          }
          '''

          app.write_text(text)

          print("Updated Android Gradle Plugin -> 8.13.2")
          print("Updated Kotlin -> 2.3.20")
          print("Java compatibility -> 17")
          print("Kotlin JVM toolchain -> 17")
          PY


      # ---------------------------------------------------------
      # 10. SHOW FINAL BUILD CONFIG
      # ---------------------------------------------------------
      - name: Show final build configuration
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          echo "========== ROOT BUILD =========="
          cat build.gradle.kts

          echo ""
          echo "========== APP BUILD =========="
          cat app/build.gradle.kts


      # ---------------------------------------------------------
      # 11. GENERATE GRADLE WRAPPER
      # ---------------------------------------------------------
      - name: Generate Gradle wrapper
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          gradle wrapper --gradle-version 8.13

          chmod +x gradlew

          ./gradlew --version


      # ---------------------------------------------------------
      # 12. CLEAN BUILD
      # ---------------------------------------------------------
      - name: Clean project
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          ./gradlew clean


      # ---------------------------------------------------------
      # 13. BUILD DEBUG APK
      # ---------------------------------------------------------
      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon


      # ---------------------------------------------------------
      # 14. VERIFY APK
      # ---------------------------------------------------------
      - name: Verify APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "       JEE COACH APK BUILD SUCCESS"
          echo "=========================================="
          echo ""

          ls -lh "$APK"


      # ---------------------------------------------------------
      # 15. UPLOAD APK
      # ---------------------------------------------------------
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: JEE-Coach-debug
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error 
