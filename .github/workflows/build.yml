name: Build JEE Coach APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract latest JEE Coach ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -name 'JEE-Coach-Native-Android-*.zip' \
            -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No JEE-Coach ZIP found."
            exit 1
          fi

          echo "Using ZIP: $ZIP"

          rm -rf extracted
          mkdir extracted

          unzip -q "$ZIP" -d extracted

          echo "Extracted project:"
          ls -la extracted

          test -f extracted/settings.gradle.kts
          test -f extracted/app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        working-directory: extracted
        run: |
          set -e
          gradle assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          set -e
          APK="extracted/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JEE-Coach-debug
          path: extracted/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
